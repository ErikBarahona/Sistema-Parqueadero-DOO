{% extends 'parqueadero/base.html' %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="login-box card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 text-center mb-1">Sistema Autónomo de Gestión de Parqueadero</h1>
    <p class="text-center text-muted">Inicie sesión para continuar</p>
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Usuario</label>
        <input name="usuario" class="form-control" autofocus required></div>
      <div class="mb-3"><label class="form-label">Contraseña</label>
        <input name="clave" type="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
