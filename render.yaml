# Blueprint de Render: crea la base de datos PostgreSQL y el servicio web del SAGP en un solo paso.
databases:
  - name: sagp-db
    databaseName: sagp_app
    user: sagp
    plan: free            # la base gratuita vence a los 30 días (ver https://render.com/docs/free)

services:
  - type: web
    name: sagp
    runtime: python
    plan: free            # se apaga tras 15 min sin uso y tarda cerca de 1 min en despertar
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py cargar_demo --solo-si-env"
    startCommand: "gunicorn sagp_web.wsgi"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sagp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CARGAR_DEMO          # "true" carga datos de demostración al desplegar; cámbialo a "false" después
        value: "true"
      - key: DEMO_CLAVE_ADMIN     # Render te pedirá estos valores al crear el Blueprint
        sync: false
      - key: DEMO_CLAVE_RESIDENTE
        sync: false
